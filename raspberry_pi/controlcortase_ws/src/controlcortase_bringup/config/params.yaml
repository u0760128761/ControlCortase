# Параметры системы ControlCortase (ROS2 Humble)
# ============================================================
# Замените блок конфигурации в зависимости от вашего железа:
#   motor_driver_type: 'l298n'   — классический L298N
#   motor_driver_type: 'bts7960' — высокотоковый BTS7960 (IBT-2, 43A)

motor_controller_node:
  ros__parameters:
    # ============================================================
    # Тип моторного драйвера: 'l298n' или 'bts7960'
    # ============================================================
    motor_driver_type: "l298n"

    # ============================================================
    # КОНФИГУРАЦИЯ L298N (используется если motor_driver_type: l298n)
    # ============================================================
    # Мотор 1 (Левый)
    ena_pin: 25 # Enable/PWM M1 (BCM)
    in1_pin: 23 # Направление IN1 (BCM)
    in2_pin: 24 # Направление IN2 (BCM)
    # Мотор 2 (Правый)
    enb_pin: 18 # Enable/PWM M2 (BCM)
    in3_pin: 17 # Направление IN3 (BCM)
    in4_pin: 27 # Направление IN4 (BCM)

    # ============================================================
    # КОНФИГУРАЦИЯ BTS7960 (используется если motor_driver_type: bts7960)
    # Замените пины согласно вашей схеме подключения.
    #
    # Рекомендованные аппаратные PWM пины RPi 3B+ (BCM):
    #   12, 13 (PWM0/PWM1, канал ALT0)
    #   18, 19 (PWM0/PWM1, канал ALT5)
    # ============================================================
    # Мотор 1 (Левый)
    m1_rpwm_pin: 12 # RPWM — ШИМ вперёд  (BCM, аппаратный PWM)
    m1_lpwm_pin: 13 # LPWM — ШИМ назад   (BCM, аппаратный PWM)
    m1_r_en_pin: 5 # R_EN — Enable правого полумоста (BCM)
    m1_l_en_pin: 6 # L_EN — Enable левого  полумоста (BCM)
    # Мотор 2 (Правый)
    m2_rpwm_pin: 19 # RPWM — ШИМ вперёд  (BCM, аппаратный PWM)
    m2_lpwm_pin: 26 # LPWM — ШИМ назад   (BCM, программный PWM)
    m2_r_en_pin: 20 # R_EN — Enable правого полумоста (BCM)
    m2_l_en_pin: 21 # L_EN — Enable левого  полумоста (BCM)

    # ============================================================
    # ПАРАМЕТРЫ PWM
    # ============================================================
    # 0 = автоматически (1000 Гц для L298N, 15000 Гц для BTS7960)
    # BTS7960 поддерживает до 25 кГц; рекомендуется 10000-20000 Гц
    pwm_frequency: 0.0

    # ============================================================
    # ПАРАМЕТРЫ СКОРОСТИ
    # ============================================================
    # Значения linear.x / angular.z из /cmd_vel, соответствующие 100% PWM
    max_linear_speed: 1.0 # м/с
    max_angular_speed: 1.0 # рад/с

    # ============================================================
    # WATCHDOG
    # ============================================================
    watchdog_timeout_ms: 500 # Аварийный стоп если нет команд > 500 мс

bluetooth_bridge_node:
  ros__parameters:
    # Максимальные скорости публикуемые в /cmd_vel
    max_linear_speed: 0.5 # м/с (безопасно для газонокосилки)
    max_angular_speed: 1.0 # рад/с

    # Bluetooth RFCOMM
    bt_channel: 1
    bt_service_name: "ControlCortase ROS2"
    reconnect_delay_s: 2.0
